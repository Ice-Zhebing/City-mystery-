<main class="login-shell"><section class="login-story"><div><h1>Explore the UK.</h1><p>Discover cities, plan a day trip and collect sightseeing stamps.</p></div><svg class="login-drawing" viewBox="0 0 400 160" aria-hidden="true"><path d="M10 139h380M20 139V80l22-19 22 19v59M27 91h28m-28 13h28M80 139V48h15V26h12v22h15v91m-34-68h26m-26 18h26m-26 18h26M151 139V63h73v76m-83-76 47-30 46 30Zm22 11v53m17-53v53m17-53v53M253 139V75h18v64m57 0V75h18v64m-96-64 12-17 12 17m51 0 12-17 12 17M271 104q28 30 57 0M277 139h45"/><circle cx="368" cy="40" r="19"/><path d="m368 17 4 18 18 5-18 4-4 18-4-18-18-4 18-5Z"/></svg></section>
<section class="login-form-panel"><div class="auth-tabs" role="tablist" aria-label="Account access"><button type="button" role="tab" aria-selected="true" data-auth-mode="login">Log in</button><button type="button" role="tab" aria-selected="false" data-auth-mode="register">Sign up</button></div><h2 id="form-title">Welcome back.</h2><p class="login-intro">Log in or create an account.</p><form id="account-form"><label for="username">Username</label><input id="username" name="username" required pattern="[A-Za-z0-9]+" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false" title="Use letters and numbers only"><p class="field-note">Letters and numbers only. Up to 32 characters.</p><label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" required pattern="[A-Za-z0-9]+" maxlength="128" autocomplete="current-password" title="Use letters and numbers only"><button id="toggle-password" type="button" aria-controls="password">Show</button></div><p class="field-note">Letters and numbers only. Both fields are required.</p><p id="login-error" class="login-error" role="alert"></p><button id="submit-account" type="submit" class="button button-primary login-submit"><span>Log in</span><span aria-hidden="true">↗</span></button></form></section></main>
</body></html>
